name: Verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run; the parity suite takes a couple of
# minutes and there is nothing to learn from a result that is already out of date.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. macOS, because that is the platform every threshold in e2e/thresholds.ts was measured
  # on, and a pixel budget is only meaningful on the rasterizer it was calibrated against. Free for
  # public repositories.
  verify:
    runs-on: macos-latest
    # A hard ceiling far above any healthy run (~10 minutes all in). Without it, a wedged dev
    # server or a hung overlay burns GitHub's 6-hour default on the macOS runner before anything
    # kills it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # Both build paths, cheap (~3s each) and otherwise unexercised until it hurts: the package
      # build only ever ran at prepublishOnly, so a broken tsconfig.build surfaced at publish time,
      # and the showcase build only ran in the deploy workflow, so a Vite/base-path breakage landed
      # on main and was discovered by the deploy - the bare-href bug shipped exactly that way once.
      - name: Build package
        run: pnpm --filter @sthobis/xui build

      - name: Build showcase
        run: pnpm --filter showcase build

      # The browser cache saves the ~100MB Chromium download on every run. Keyed on the lockfile:
      # a Playwright bump changes the pinned browser revision, and a stale browser under a new
      # Playwright is exactly the mismatch the install step exists to prevent.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Only chromium: both Playwright projects run on it, and the parity numbers are meaningful
      # only within one engine anyway. Cheap no-op on a cache hit - it verifies rather than
      # re-downloads.
      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium

      # parity + preflight + behavior. GitHub sets CI=true, which is what makes playwright.config
      # start its own dev server instead of reusing one - see reuseExistingServer there.
      #
      # Geist is bundled through @fontsource-variable/geist rather than fetched from a CDN, so the
      # runner rasterizes the same font files a developer's machine does. That matters more here
      # than it looks: a webfont that resolved differently on Linux would move text on BOTH sides of
      # every pair, and the suite would still pass while measuring something nobody ships.
      - name: Parity, preflight and behavior suites
        run: pnpm verify

      # The diff triptych (ref / mui / diff per failing pair, per project directory) plus the run's
      # reports. Without this a red run tells you a pair moved but not how, and pixel failures are
      # not diagnosable from a log line.
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-diffs
          path: e2e/results/
          retention-days: 7

  # NOT a gate, on purpose - but the reason has changed, and the answer is worth keeping.
  #
  # This job used to fail seven pairs at Δ67-121 that are an exact match on macOS, which left an
  # uncomfortable question open: harmless rasterizer noise, or real sub-pixel geometry that macOS
  # rounds away and Linux exposes? The second would have meant those pairs were wrong everywhere and
  # only looked right on one platform.
  #
  # Measured from this job's own artifacts, it was neither a theme bug nor mere noise: no capture
  # differed in SIZE, every differing pixel sat inside a text band, and the signed difference
  # averaged about zero against a large absolute one - a positional shift of glyphs, not a colour or
  # layout difference. Font HINTING was the amplifier, quantising two texts a fraction of a pixel
  # apart onto different grids. Disabling it in playwright.config.ts took tooltip-open from 1311px
  # at Δ103 to 43px at Δ1, textfield-error from 2834px at Δ123 to 20px at Δ1, and badgecount-basic
  # to zero, with the macOS gate still green.
  #
  # What is left is one pair: dark-buttongroup-basic. At a threshold above Δ2 it is FOURTEEN pixels,
  # in two column pairs, on the vertical seams between adjacent buttons - the rest of its 248 count
  # is sub-Δ2 noise. It is deliberately NOT given a maxDeltaOverrides entry, because that file is
  # platform-independent: an override bought for Linux would loosen this pair on macOS, where it
  # measures exactly zero. A non-blocking job carrying one invisible seam artifact is the cheaper
  # trade.
  #
  # Runs ONLY the pixel suite: its whole reason to exist is rasterizer differences, and preflight,
  # behavior, typecheck and the unit tests are platform-independent checks the macOS gate already
  # ran. Re-running them here doubled the job's cost for no added signal - and the behavior sweeps'
  # timing on a shared Linux runner was the flakiest thing in the whole pipeline while being
  # continue-on-error anyway.
  linux-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # --with-deps here and not on macOS: it installs the LINUX system libraries the hosted
      # runner lacks; on macOS it is a no-op wrapper around the plain install.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:parity
      - name: Upload diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-parity-diffs
          path: e2e/results/
          retention-days: 7
